[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-rt-translator"
version = "0.1.0"
description = "Stream-based manga translator with OCR, translation memory, and overlay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<2.0",
]

[project.optional-dependencies]
windows = [
  "dxcam>=0.0.5",
  "onnxruntime-directml>=1.17",
]
windows-wgc = [
  "windows-capture==2.0.1",
  "opencv-python==4.10.0.84",
]
cv = [
  "opencv-python==4.10.0.84",
]
ocr = [
  "opencv-python==4.10.0.84",
  "paddleocr>=2.8.0",
  # PaddleOCR 3.x runs on the paddlex pipeline and paddlepaddle; both are
  # imported indirectly and must be installed. Validated with paddlepaddle
  # 3.3.1 (the oneDNN workaround in ocr.py targets that build).
  "paddlex>=3.0",
  "paddlepaddle>=3.0",
]
overlay = [
  # 6.11 has a QWebEngineView child-widget lifecycle bug (see CONTEXT.md),
  # mitigated by the top-level overlay; cap the range to avoid pulling an
  # untested newer major on a fresh install.
  "PySide6>=6.6,<6.12",
]
fuzzy = [
  "rapidfuzz>=3.6",
]
# Optional ONNX Runtime OCR backend (detector = "rapid"). Ships prebuilt
# PP-OCR models; lighter and usually faster than Paddle for English/Latin.
rapid = [
  "rapidocr-onnxruntime>=1.2",
]
offline = [
  "argostranslate>=1.9.0",
]
dev = [
  "pytest>=8.0",
]
packaging = [
  "pyinstaller>=6.10,<7",
]
readme-media = [
  "Pillow>=10",
]

[project.scripts]
manga-rt-translator = "manga_rt_translator.cli:main"

[tool.setuptools.packages.find]
include = ["manga_rt_translator*"]
