[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-rt-translator"
version = "0.1.0"
description = "Stream-based manga translator with OCR, translation memory, and overlay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
windows = [
  "dxcam>=0.0.5",
  "onnxruntime-directml>=1.17",
]
cv = [
  "opencv-python>=4.8",
]
ocr = [
  "opencv-python>=4.8",
  "paddleocr>=2.8.0",
]
overlay = [
  "PySide6>=6.6",
]
fuzzy = [
  "rapidfuzz>=3.6",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
manga-rt-translator = "manga_rt_translator.cli:main"

[tool.setuptools.packages.find]
include = ["manga_rt_translator*"]
