[capture]
backend = "auto"
fps = 30
monitor = 0
# Optional capture target by window title on Windows.
# window_title = "Chrome"
# Optional capture region in screen coordinates: left, top, right, bottom.
# region = [0, 0, 1920, 1080]

[diff]
tile_size = 96
pixel_threshold = 22
min_changed_ratio = 0.015
roi_padding = 20
stable_ms = 220
max_rois_per_tick = 12
large_change_tile_ratio = 0.55
scroll_cooldown_ms = 300

[ocr]
enabled = true
# PaddleOCR language names: en | japan | korean
source_lang = "en"
# Extra fallback OCR engines; the best-scoring result wins per region.
extra_langs = []
min_confidence = 0.55
ignore_top_pixels = 120
# Detection model: mobile (fast, recommended for scroll) | server (slower)
det_model = "mobile"
# Recognition model: mobile (fast) | server (better on stylized comic fonts)
rec_model = "mobile"
# Text detector: paddle (recommended) | rapid (RapidOCR via ONNX Runtime,
# lighter/faster for English/Latin; needs rapidocr-onnxruntime) | comic
# (experimental, downloads an additional ~90 MB ONNX model)
detector = "paddle"
# Large OCR inputs are reduced proportionally; smaller crops remain unchanged.
max_input_side = 640
# CPU threads for OCR inference. 0 = auto (min(8, cpu_count)). Raise on a
# many-core machine to shorten dense pages; OCR runs below-normal priority.
cpu_threads = 0

[translation]
target_lang = "pt-BR"
# Providers: google | gemini | deepl | libre | aihub | argos (offline models) | echo (debug)
provider = "google"
# Aihub package identity; the backend must authorize this package.
aihub_app_package = "com.ultraocr"
aihub_engine = "gemini"
# deepl_api_key = ""
# deepl_free = true
# Minimum spacing between Gemini requests (seconds). Lower = faster, more 429s.
# gemini_min_interval = 1.0
# API keys are read from MANGA_RT_GEMINI_API_KEY,
# MANGA_RT_DEEPL_API_KEY, or MANGA_RT_LIBRE_API_KEY.
timeout_seconds = 20
fuzzy_threshold = 92

[overlay]
enabled = true
font_family = "Segoe UI"
font_size = 18
opacity = 0.94
ttl_seconds = 900

[cache]
path = "manga_translations.sqlite3"

[rate_limits.google]
failure_threshold = 3
open_duration_s = 60
rps = 4.0
burst = 10
quality = 6
daily_limit = 0
chars = false

[rate_limits.gemini]
failure_threshold = 5
open_duration_s = 180
rps = 0.5
burst = 5
quality = 9
daily_limit = 1500
reset_at_utc_hour = 0
chars = false

[rate_limits.deepl]
failure_threshold = 3
open_duration_s = 120
rps = 1.0
burst = 3
quality = 9
daily_limit = 500000
reset_at_utc_hour = 1
chars = true

[rate_limits.libre]
failure_threshold = 3
open_duration_s = 60
rps = 10.0
burst = 20
quality = 7
daily_limit = 0
chars = false

[logging]
level = "INFO"
rate_limiter_periodic_s = 30
rate_limiter_cache_s = 60
rate_limiter_emit_per_request = false
